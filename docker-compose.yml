# Uso: python scripts/preparar_docker.py --levantar
# Guía completa en docs/DOCKER.md
name: clinica-dental

x-backend: &backend
  build: .
  image: clinica-dental-backend
  env_file:
    - .env.docker
  environment:
    DB_HOST: db
    DB_PORT: "5432"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - datos_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Instala la base la primera vez y aplica las migraciones pendientes en cada arranque
  migraciones:
    <<: *backend
    command: ["python", "scripts/iniciar_base_docker.py"]
    env_file:
      - .env.docker
      - path: .env.docker.admin
        required: false
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      HOST: 0.0.0.0
      PORT: "8000"
      # Solo la web puede llegar al backend: se confía en la IP del cliente que ella informa
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      migraciones:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build: ./frontend
    image: clinica-dental-web
    restart: unless-stopped
    # Por HTTP solo se abre en este equipo. Para otros equipos usa el perfil https: consulta docs/DOCKER.md
    ports:
      - "127.0.0.1:${CLINICA_PUERTO_WEB:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

  # HTTPS para abrir el sistema a otros equipos: docker compose --profile https up -d
  https:
    image: caddy:2.10-alpine
    profiles: ["https"]
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${CLINICA_PUERTO_HTTP:-80}:80"
      - "${CLINICA_PUERTO_HTTPS:-443}:443"
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started

  # Copia automática diaria. La carpeta se elige con CLINICA_RESPALDOS, y debería estar en otro disco.
  respaldos:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PGHOST: db
      RESPALDO_HORA: "${RESPALDO_HORA:-21}"
      RESPALDO_CONSERVAR: "${RESPALDO_CONSERVAR:-30}"
    volumes:
      - ${CLINICA_RESPALDOS:-./backups}:/backups
      - ./deploy/respaldo_diario.sh:/respaldo_diario.sh:ro
    entrypoint: ["sh", "/respaldo_diario.sh"]
    # Espera a la instalación: una copia de una base aún vacía contaría como la del día
    depends_on:
      migraciones:
        condition: service_completed_successfully

  # Copia de seguridad en el momento: docker compose run --rm respaldo
  respaldo:
    image: postgres:18-alpine
    profiles: ["herramientas"]
    env_file:
      - .env.docker
    environment:
      PGHOST: db
    volumes:
      - ${CLINICA_RESPALDOS:-./backups}:/backups
    entrypoint: ["sh", "-c"]
    command:
      - >-
        archivo="/backups/clinica_docker_$$(date +%Y%m%d_%H%M%S).dump" &&
        PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -U "$$POSTGRES_USER" --format=custom --file="$$archivo.parcial" "$$POSTGRES_DB" &&
        pg_restore --list "$$archivo.parcial" > /dev/null &&
        mv "$$archivo.parcial" "$$archivo" &&
        echo "Copia creada y comprobada: $$archivo"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_postgres:
  caddy_datos:
  caddy_config:
